name: Build & Release Multi-OS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            build_cmd: npm run build:win
            artifact_pattern: dist/Edge-Drop-Setup-*.exe
          - os: macos-latest
            name: macOS
            build_cmd: npm run build:mac
            artifact_pattern: dist/Edge-Drop-Mac-*.*
          - os: ubuntu-latest
            name: Linux
            build_cmd: npm run build:linux
            artifact_pattern: dist/Edge-Drop-Linux-*.*

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools fakeroot rpm libnotify-bin

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Test Suites
        run: npm test

      - name: Verify TypeScript Contracts
        run: npm run typecheck

      - name: Compile & Package Application
        run: ${{ matrix.build_cmd }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-drop-${{ matrix.name }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  release:
    name: Publish Release & Integrity Hashes
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: edge-drop-*
          path: dist
          merge-multiple: true

      - name: Generate Cryptographic Release Notes & SHA-256 Hashes
        run: node scripts/generate-release-notes.mjs

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "TAG_NAME=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG_NAME }}
          name: Edge-Drop ${{ steps.release_tag.outputs.TAG_NAME }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
